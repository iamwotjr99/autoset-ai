spring:
  application:
    name: backend

  jpa:
    properties:
      hibernate:
        format_sql: true

  ai:
    openai:
      api-key: ${SPRING_AI_OPENAI_API_KEY}

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

jwt:
  secret: ${JWT_SECRET}
  access-expiration: ${JWT_ACCESS_EXPIRATION}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION}

