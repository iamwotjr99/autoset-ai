spring:
  application:
    name: backend
  jpa:
    hibernate:
      # 테스트 시작 시 테이블 새로 생성
      ddl-auto: create
  ai:
    openai:
     api-key: dummy-api-key-for-testing-12345

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

jwt:
  secret: ${JWT_SECRET}
  access-expiration: ${JWT_ACCESS_EXPIRATION}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION}
