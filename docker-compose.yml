version: '3.8'

services:
  # 1. MySQL 8.0 데이터베이스
  mysql:
    image: mysql:8.0
    container_name: autoset-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: autoset_db
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - autoset-mysql-data:/var/lib/mysql

  # 2. Redis 캐시 서버 (JWT 및 AI 쿼터 동시성 제어용)
  redis:
    image: redis:alpine
    container_name: autoset-redis
    ports:
      - "6379:6379"
    volumes:
      - autoset-redis-data:/data

  # 3. Spring Boot 백엔드 애플리케이션
  backend:
    image: iamwotjr99/autoset-backend:latest
    container_name: autoset-backend
    ports:
      - "8080:8080"
    depends_on:
      - mysql
      - redis
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/autoset_db?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_JPA_HIBERNATE_DDL_AUTO: update

volumes:
  autoset-mysql-data:
  autoset-redis-data: