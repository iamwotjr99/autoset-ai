name: AutoSet AI CI/CD Pipeline

on:
  push:
    branches:
      - "main"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # 1. Github 레포지토리 코드 가져오기
      - name: Checkout Code
        uses: actions/checkout@v3

    # 2. Java 21 환경 세팅
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle' # 빌드 속도 향상을 위한 캐싱

    # 3. Gradle 권한 부여 및 빌드
      - name: Gradle execute permission for gradlew
        run: chmod +x gradlew
        working-directory: ./backend

      - name: Build with Gradle
        run: ./gradlew clean build -x test
        working-directory: ./backend

    # 4. Docker Hub 로그인
      - name: Log in to Doker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

    # 5. Docker Image 빌드 및 푸시
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/autoset-backend:latest

    # 6. EC2 서버로 docker-compose.prod 파일 SCP 전송
      - name: Copy docker-compose file to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.prod.yml"
          target: "/home/ubuntu/"

    # 6. AWS EC2 서버에 SSH 접속 후 .env 생성 및 배포
      - name: Deploy to AWS EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          DB_URL: ${{ secrets.SPRING_DATASOURCE_URL }}
          DB_USER: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
          DB_PASS: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          JWT_SEC: ${{ secrets.JWT_SECRET }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DB_URL, DB_USER, DB_PASS, JWT_SEC  # github secrets 변수들을 SSH 환경으로 전달
          script: |
            # EC2 서버에 동적으로 .env 파일 생성 (환경변수 주입)
            echo "SPRING_DATASOURCE_URL=$DB_URL" > .env
            echo "SPRING_DATASOURCE_USERNAME=$DB_USER" >> .env
            echo "SPRING_DATASOURCE_PASSWORD=$DB_PASS" >> .env
            echo "JWT_SECRET=$JWT_SEC" >> .env
            
            # 도커 배포 프로세스
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/autoset-backend:latest
            sudo docker-compose -f docker-compose.prod.yml down
            sudo docker-compose -f docker-compose.prod.yml up -d
            sudo docker image prune -f